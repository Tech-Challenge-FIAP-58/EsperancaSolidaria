apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1

    # Remove por nome antes de recriar: sem isso, mudar o uid de um datasource que
    # ja existe no banco do Grafana (PVC) quebra o boot com "data source not found".
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Zabbix
        orgId: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true

      - name: Zabbix
        uid: zabbix
        type: alexanderzobnin-zabbix-datasource
        access: proxy
        url: http://zabbix-zabbix-web.monitoring.svc.cluster.local/api_jsonrpc.php
        editable: true
        jsonData:
          username: Admin
          trends: true
          trendsFrom: "7d"
          trendsRange: "4h"
          cacheTTL: "1h"
        secureJsonData:
          password: zabbix

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-plugins
  namespace: monitoring
data:
  apps.yaml: |
    apiVersion: 1
    apps:
      - type: alexanderzobnin-zabbix-app
        org_id: 1
        disabled: false

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_INSTALL_PLUGINS
              value: "alexanderzobnin-zabbix-app"
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "esperancagrafana123"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-plugins
              mountPath: /etc/grafana/provisioning/plugins
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-plugins
          configMap:
            name: grafana-plugins
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

---

apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
  selector:
    app: grafana